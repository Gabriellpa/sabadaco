# Backup diário do Mongo do sabadaco, no mesmo molde do postgres-backup da plataforma:
# mongodump comprimido no PVC sabadaco-mongo-backups (retenção 7 dias) e, se configurado,
# cópia fora da VM via rclone.
#
# Cópia externa: crie no ns prd o mesmo Secret usado no infra-platform, com outro destino:
#   kubectl -n prd create secret generic backup-rclone \
#     --from-file=rclone.conf=$HOME/.config/rclone/rclone.conf \
#     --from-literal=RCLONE_DEST=<remote>:<bucket>/sabadaco
# Sem o Secret, o passo de cópia só registra "rclone não configurado" e sai OK.
#
# Restore: README.md desta pasta.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sabadaco-mongo-backup
  labels:
    app: sabadaco-mongo
    role: backup
spec:
  schedule: "15 3 * * *"         # 03:15 UTC, depois do postgres-backup (03:00)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: sabadaco-mongo
            role: backup
        spec:
          restartPolicy: OnFailure
          # 1º: dump local
          initContainers:
            - name: dump
              image: mongo:8.2.12
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  TS=$(date +%Y%m%d-%H%M%S)
                  OUT=/backup/mongo-${TS}.archive.gz
                  echo "[backup] starting: $OUT"
                  mongodump --host sabadaco-mongo --port 27017 \
                    --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" \
                    --authenticationDatabase admin --db sabadaco \
                    --archive="$OUT" --gzip
                  # arquivo vazio = falha silenciosa; não deixa passar
                  gzip -t "$OUT" && [ "$(stat -c %s "$OUT")" -gt 0 ]
                  echo "[backup] done: $(du -h "$OUT")"
                  echo "[cleanup] removing backups older than 7 days"
                  find /backup -name 'mongo-*.archive.gz' -mtime +7 -delete
                  ls -lh /backup/
              envFrom:
                - secretRef:
                    name: sabadaco-mongo
              volumeMounts:
                - name: backup-vol
                  mountPath: /backup
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { cpu: 200m, memory: 256Mi }
          # 2º: cópia fora da VM (opcional, ver cabeçalho)
          containers:
            - name: offsite
              image: rclone/rclone:1.68.2
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ ! -f /config/rclone/rclone.conf ] || [ -z "${RCLONE_DEST:-}" ]; then
                    echo "[offsite] rclone não configurado (Secret backup-rclone ausente); só backup local"
                    exit 0
                  fi
                  echo "[offsite] copiando para $RCLONE_DEST"
                  rclone copy /backup "$RCLONE_DEST" --include 'mongo-*.archive.gz' --max-age 25h -v
                  # retenção remota: 30 dias
                  rclone delete "$RCLONE_DEST" --include 'mongo-*.archive.gz' --min-age 30d -v
              env:
                - name: RCLONE_CONFIG
                  value: /config/rclone/rclone.conf
                - name: RCLONE_DEST
                  valueFrom:
                    secretKeyRef:
                      name: backup-rclone
                      key: RCLONE_DEST
                      optional: true
              volumeMounts:
                - name: backup-vol
                  mountPath: /backup
                  readOnly: true
                - name: rclone-config
                  mountPath: /config/rclone
                  readOnly: true
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
          volumes:
            - name: backup-vol
              persistentVolumeClaim:
                claimName: sabadaco-mongo-backups
            - name: rclone-config
              secret:
                secretName: backup-rclone
                optional: true
                items:
                  - key: rclone.conf
                    path: rclone.conf
