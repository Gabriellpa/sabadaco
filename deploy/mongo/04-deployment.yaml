apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabadaco-mongo
  labels:
    app: sabadaco-mongo
spec:
  replicas: 1
  # PVC ReadWriteOnce: Recreate evita dois pods montando o mesmo volume no rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabadaco-mongo
  template:
    metadata:
      labels:
        app: sabadaco-mongo
    spec:
      containers:
        - name: mongo
          # 8.2 e não 8.0: a 8.0 se recusa a subir em kernel Linux >= 6.19 (SERVER-121912),
          # e a VM roda 7.0. Testado na VM em 2026-10-09.
          image: mongo:8.2.12
          imagePullPolicy: IfNotPresent
          # Cache do WiredTiger em 256MB (o padrão é metade da RAM do node).
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - name: mongo
              containerPort: 27017
              protocol: TCP
          envFrom:
            - secretRef:
                name: sabadaco-mongo
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          # tcpSocket e não mongosh: cada exec do mongosh sobe um Node.js (~100MB, ~1s de CPU).
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
      securityContext:
        # Usuário mongodb da imagem oficial (999): o kubelet ajusta o dono do volume.
        fsGroup: 999
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sabadaco-mongo-data
        - name: init
          configMap:
            name: sabadaco-mongo-init
