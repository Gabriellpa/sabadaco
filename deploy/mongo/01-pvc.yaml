# local-path tem reclaimPolicy Delete: apagar este PVC apaga os dados. Nunca rode
# `kubectl delete -k deploy/mongo` sem ter um dump recente (ver README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabadaco-mongo-data
  labels:
    app: sabadaco-mongo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# Dumps diários do CronJob sabadaco-mongo-backup. PVC e não hostPath porque o ns prd
# roda com Pod Security "baseline", que proíbe hostPath.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabadaco-mongo-backups
  labels:
    app: sabadaco-mongo
    role: backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
