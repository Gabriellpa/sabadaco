# MongoDB do sabadaco no namespace prd (dados das playlists).
# Antes do primeiro apply, crie o Secret com ./create-secret.sh (ver README.md).
#   kubectl apply -k deploy/mongo
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prd
resources:
  - 01-pvc.yaml
  - 02-service.yaml
  - 03-init-configmap.yaml
  - 04-deployment.yaml
  - 05-backup-cronjob.yaml
