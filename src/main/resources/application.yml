spring:
  application:
    name: sabadaco
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true

discord:
  token: ${DISCORD_BOT_TOKEN}
  # Registra os comandos só neste servidor (propaga na hora). Vazio = comandos globais.
  dev-guild-id: ${DISCORD_DEV_GUILD_ID:}

sabadaco:
  storage:
    # memory (padrão: some ao reiniciar) | mongo — escolhe a implementação de PlaylistRepository
    type: ${STORAGE_TYPE:memory}
    # Usada só com type=mongo. O nome do banco vem da URI.
    mongo-uri: ${MONGODB_URI:mongodb://localhost:27017/sabadaco}
  # Ids de usuários do Discord que veem e tocam a playlist de qualquer pessoa (separados por vírgula)
  discord-admins: ${DISCORD_ADMIN_IDS:334670701011271682}
  youtube:
    cipher-url: ${YOUTUBE_CIPHER_URL:https://cipher.kikkia.dev/api}
    cipher-password: ${YOUTUBE_CIPHER_PASSWORD:}
    # Login OAuth (client TV) para quando o YouTube exigir login. Use uma conta Google descartável.
    oauth-enabled: ${YOUTUBE_OAUTH_ENABLED:false}
    oauth-refresh-token: ${YOUTUBE_OAUTH_REFRESH_TOKEN:}
  admin:
    username: ${ADMIN_USER:admin}
    # Vazio = gera uma senha aleatória e mostra no log ao subir
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: sabadaco
