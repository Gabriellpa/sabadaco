spring:
  application:
    name: sabadaco
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true

discord:
  token: ${DISCORD_BOT_TOKEN}
  # Registra os comandos só neste servidor (propaga na hora). Vazio = comandos globais.
  dev-guild-id: ${DISCORD_DEV_GUILD_ID:}
  # Espelha o chat do canal de texto na página da stream. Ligue antes "Message Content Intent" no Developer Portal
  # (Bot → Privileged Gateway Intents), senão o bot não conecta.
  message-content: ${DISCORD_MESSAGE_CONTENT:false}

sabadaco:
  storage:
    # memory (padrão: some ao reiniciar) | mongo — escolhe a implementação de PlaylistRepository
    type: ${STORAGE_TYPE:memory}
    # Usada só com type=mongo. O nome do banco vem da URI.
    mongo-uri: ${MONGODB_URI:mongodb://localhost:27017/sabadaco}
  # Ids de usuários do Discord que veem e tocam a playlist de qualquer pessoa (separados por vírgula)
  discord-admins: ${DISCORD_ADMIN_IDS:334670701011271682}
  youtube:
    cipher-url: ${YOUTUBE_CIPHER_URL:https://cipher.kikkia.dev/api}
    cipher-password: ${YOUTUBE_CIPHER_PASSWORD:}
    # Login OAuth (client TV) para quando o YouTube exigir login. Use uma conta Google descartável.
    oauth-enabled: ${YOUTUBE_OAUTH_ENABLED:false}
    oauth-refresh-token: ${YOUTUBE_OAUTH_REFRESH_TOKEN:}
  stream:
    # Endereço público do bot (o do Cloudflare Tunnel): os links das streams enviados por DM usam ele
    public-url: ${STREAM_PUBLIC_URL:http://localhost:8080}
    # Validade dos códigos de entrada (uso único, por pessoa, valem para as streams do canal de voz)
    code-ttl: ${STREAM_CODE_TTL:5m}
    livekit:
      # Ex.: wss://seu-projeto.livekit.cloud. Sem URL/key/secret, o /stream fica desativado.
      url: ${LIVEKIT_URL:}
      api-key: ${LIVEKIT_API_KEY:}
      api-secret: ${LIVEKIT_API_SECRET:}
  admin:
    username: ${ADMIN_USER:admin}
    # Vazio = gera uma senha aleatória e mostra no log ao subir
    password: ${ADMIN_PASSWORD:}

management:
  # Porta só para o cluster (Prometheus, probes): /actuator/prometheus sem login aqui; o painel fica na 8080.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: sabadaco
    distribution:
      # Poucos buckets fixos: dá p95 por comando no Grafana sem explodir o número de séries
      slo:
        sabadaco.commands: 100ms,250ms,500ms,1s,2s,5s
        sabadaco.components: 100ms,250ms,500ms,1s,2s,5s
