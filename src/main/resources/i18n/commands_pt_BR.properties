# Tradução dos comandos para clientes do Discord em português (pt-BR).
# O padrão (inglês) fica no código. Formato das chaves:
#   comando.name / comando.description
#   comando.options.opcao.name / .description
#   comando.subcomando.name / .description / .options.opcao.(name|description)
#   ...options.opcao.choices.<nome da escolha em inglês, minúsculo, espaços viram _>.name
# O teste CommandRegistrarTest falha se algum comando/opção/escolha ficar sem tradução.

