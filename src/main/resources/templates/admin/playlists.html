<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{admin/fragments :: head('Playlists')}"></head>
<body hx-ext="morph">
<div class="app">
    <aside th:replace="~{admin/fragments :: sidebar}"></aside>
    <div class="main">
        <header class="topbar">
            <div>
                <h1>Playlists</h1>
                <p class="muted small">Playlists de cada pessoa, do servidor ou globais.</p>
            </div>
        </header>
        <main class="content">
            <div th:replace="~{admin/fragments :: flash}"></div>

            <datalist id="users">
                <option th:each="user : ${users}" th:value="${user.key}" th:text="${user.value}"></option>
            </datalist>

            <form class="card filters" th:action="@{/admin/playlists}" method="get">
                <label>Dono (id) <input name="owner" list="users" th:value="${owner}" inputmode="numeric"></label>
                <label>Servidor
                    <select name="guild">
                        <option value="">Todos</option>
                        <option th:each="g : ${guilds}" th:value="${g.id()}" th:text="${g.name()}" th:selected="${guild == g.id()}">servidor</option>
                    </select>
                </label>
                <button class="primary">Filtrar</button>
                <a class="btn" th:href="@{/admin/playlists}">Limpar</a>
            </form>

            <div class="card section-gap">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Nome</th><th>Dono</th><th>Escopo</th><th>Servidor</th><th class="num">Músicas</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(playlists)}"><td colspan="5" class="muted">Nenhuma playlist.</td></tr>
                        <tr th:each="playlist : ${playlists}">
                            <td><a th:href="@{/admin/playlists/{id}(id=${playlist.id()})}" th:text="${playlist.name()}">nome</a></td>
                            <td th:text="${@views.owner(playlist)}">dono</td>
                            <td><span class="badge" th:text="${@views.scope(playlist)}">escopo</span></td>
                            <td th:text="${@views.guild(playlist.guildId())}">servidor</td>
                            <td class="num" th:text="${playlist.tracks().size()}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <form class="card section-gap" th:action="@{/admin/playlists}" method="post">
                <div class="card-head"><h2>➕ Nova playlist</h2></div>
                <div class="grid two">
                    <label>Dono (id do usuário; vazio nas playlists do servidor) <input name="ownerId" list="users" inputmode="numeric"></label>
                    <label>Nome <input name="name" required maxlength="50"></label>
                    <label>Escopo
                        <select name="scope">
                            <option value="GUILD">Só no servidor</option>
                            <option value="GLOBAL">Global</option>
                            <option value="SERVER">Do servidor (o dono é o servidor)</option>
                        </select>
                    </label>
                    <label>Servidor (escopos "só no servidor" e "do servidor")
                        <select name="guildId">
                            <option value="">—</option>
                            <option th:each="g : ${guilds}" th:value="${g.id()}" th:text="${g.name()}">servidor</option>
                        </select>
                    </label>
                </div>
                <button class="primary">Criar</button>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments :: listenBar}"></div>
</body>
</html>
