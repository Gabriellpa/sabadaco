plugins {
    id "java"
    id "org.springframework.boot" version "4.1.1"
    id "io.spring.dependency-management" version "1.1.7"
    id "io.freefair.lombok" version "9.8.0"
}

group = "com.gabriellpa"
version = "0.0.1-SNAPSHOT"
description = "sabadaco"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.lavalink.dev/releases" }
    maven { url "https://maven.lavalink.dev/snapshots" }
}

ext {
    set("jdaVersion", "6.7.0")
    set("jdaveVersion", "0.1.8")
    set("lavaplayerVersion", "2.2.7")
    // Snapshot fixado por commit: a 1.18.2 não toca sem login (youtube-source#240); neste commit o client IOS voltou a tocar.
    // Trocar pela próxima release (1.18.3+) quando sair.
    set("lavaplayerYoutubeSourceVersion", "2be8e542d3f6f178e048dca565892684c2e40177-SNAPSHOT")
    set("htmxVersion", "2.0.11")
    set("idiomorphVersion", "0.7.4")
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-webmvc") {
        because "Serves the admin panel"
    }
    implementation("org.springframework.boot:spring-boot-starter-thymeleaf") {
        because "Server-side templates for the admin panel"
    }
    implementation("org.springframework.boot:spring-boot-starter-security") {
        because "Protects the admin panel with a simple login"
    }
    implementation("org.springframework.boot:spring-boot-starter-actuator") {
        because "Exposes health and custom Micrometer metrics"
    }
    implementation("io.micrometer:micrometer-registry-prometheus") {
        because "Exposes metrics at /actuator/prometheus"
    }
    implementation("org.webjars.npm:htmx.org:${htmxVersion}") {
        because "Live updates in the admin panel without a frontend build"
    }
    implementation("org.webjars.npm:idiomorph:${idiomorphVersion}") {
        because "HTMX morph: atualiza só o que mudou no polling (sem piscar nem reiniciar animações)"
    }
    implementation("org.webjars:webjars-locator-lite") {
        because "Version-agnostic /webjars/** URLs"
    }
    annotationProcessor("org.springframework.boot:spring-boot-configuration-processor") {
        because "Generates metadata for @ConfigurationProperties"
    }

    implementation("net.dv8tion:JDA:${jdaVersion}") {
        exclude module: "opus-java"
        because "Discord API client (audio is encoded by Lavaplayer, so opus-java is not needed)"
    }
    implementation("club.minnced:jdave-api:${jdaveVersion}") {
        because "DAVE (E2EE) is mandatory for Discord voice connections since 2026-03-01"
    }
    runtimeOnly("club.minnced:jdave-native-win-x86-64:${jdaveVersion}")
    runtimeOnly("club.minnced:jdave-native-linux-x86-64:${jdaveVersion}")
    runtimeOnly("club.minnced:jdave-native-linux-aarch64:${jdaveVersion}")
    runtimeOnly("club.minnced:jdave-native-darwin:${jdaveVersion}")

    implementation("dev.arbjerg:lavaplayer:${lavaplayerVersion}") {
        because "Audio loading and playback"
    }
    implementation("dev.lavalink.youtube:v2:${lavaplayerYoutubeSourceVersion}") {
        because "Maintained YouTube source for Lavaplayer"
    }

    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test")
    testImplementation("org.springframework.boot:spring-boot-starter-security-test")
    testImplementation("org.awaitility:awaitility")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

def nativeAccess = ["--enable-native-access=ALL-UNNAMED"]

tasks.named("test") {
    useJUnitPlatform()
    jvmArgs nativeAccess
}

tasks.named("bootJar") {
    archiveFileName = "sabadaco.jar"
}

tasks.named("bootRun") {
    jvmArgs nativeAccess
}
